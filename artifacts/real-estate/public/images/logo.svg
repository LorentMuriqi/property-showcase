<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">AURA360 vector logo</title>
  <desc id="desc">A premium gold house and forward chevron emblem with four rounded window panes on a transparent background.</desc>
  <defs>
    <linearGradient id="chevronGold" gradientUnits="userSpaceOnUse" x1="260" y1="145" x2="800" y2="855">
      <stop offset="0" stop-color="#9A5A10"/>
      <stop offset="0.12" stop-color="#D79B34"/>
      <stop offset="0.26" stop-color="#FFE49A"/>
      <stop offset="0.39" stop-color="#D39B38"/>
      <stop offset="0.52" stop-color="#A46013"/>
      <stop offset="0.65" stop-color="#F0C66B"/>
      <stop offset="0.78" stop-color="#AC6815"/>
      <stop offset="0.90" stop-color="#F7D57F"/>
      <stop offset="1" stop-color="#85500D"/>
    </linearGradient>
    <linearGradient id="windowGold" gradientUnits="userSpaceOnUse" x1="210" y1="410" x2="450" y2="660">
      <stop offset="0" stop-color="#FFE49A"/>
      <stop offset="0.28" stop-color="#E9B957"/>
      <stop offset="0.60" stop-color="#A96113"/>
      <stop offset="0.84" stop-color="#F1C868"/>
      <stop offset="1" stop-color="#8A4E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="9" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.11  0 0 0 0 0.02  0 0 0 0.22 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M 355 175 L 790 500 L 355 825"
          fill="none"
          stroke="url(#chevronGold)"
          stroke-width="166"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <g>
      <rect x="210" y="418" width="104" height="104" rx="19" fill="url(#windowGold)" stroke="#F8D77C" stroke-width="2"/>
      <rect x="329" y="418" width="104" height="104" rx="19" fill="url(#windowGold)" stroke="#F8D77C" stroke-width="2"/>
      <rect x="210" y="537" width="104" height="104" rx="19" fill="url(#windowGold)" stroke="#F8D77C" stroke-width="2"/>
      <rect x="329" y="537" width="104" height="104" rx="19" fill="url(#windowGold)" stroke="#F8D77C" stroke-width="2"/>
    </g>
  </g>
</svg>